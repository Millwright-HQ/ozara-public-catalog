<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OZARA Catalog</title>
    <meta name="description" content="OZARA product catalog for shops: names, SKUs, prices and photos." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="wrap top-row">
        <img class="logo" src="logo.svg" alt="OZARA" />
        <span class="tag">Product catalog</span>
      </div>
    </header>

    <main class="wrap">
      <section class="tools" aria-label="Find products">
        <label class="search">
          <span class="sr">Search products or SKUs</span>
          <input id="q" type="search" placeholder="Search by name, SKU or brand" autocomplete="off" />
        </label>
        <label class="select">
          <span class="sr">Category</span>
          <select id="category"></select>
        </label>
        <label class="select">
          <span class="sr">Availability</span>
          <select id="avail">
            <option value="all">All products</option>
            <option value="in">In stock</option>
            <option value="out">Sold out</option>
          </select>
        </label>
      </section>
      <p id="count" class="count" aria-live="polite"></p>
      <div id="state" class="state" hidden></div>
      <ul id="grid" class="grid"></ul>
    </main>

    <dialog id="detail" aria-labelledby="d-name">
      <article>
        <button class="close" id="close" aria-label="Close">×</button>
        <div class="d-grid">
          <div class="gallery">
            <div class="stage"><img id="d-img" alt="" /></div>
            <div id="d-thumbs" class="thumbs"></div>
          </div>
          <div class="info">
            <p id="d-brand" class="brand"></p>
            <h2 id="d-name"></h2>
            <p id="d-badges" class="badges"></p>
            <p id="d-price" class="price"></p>
            <p id="d-desc" class="desc"></p>
            <ul id="d-highlights" class="highlights"></ul>
            <h3>Also part of</h3>
            <ul id="d-cats" class="chips"></ul>
            <h3>SKUs and prices</h3>
            <table class="skus">
              <thead>
                <tr><th>SKU</th><th>Option</th><th class="num">Price</th></tr>
              </thead>
              <tbody id="d-skus"></tbody>
            </table>
          </div>
        </div>
      </article>
    </dialog>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
